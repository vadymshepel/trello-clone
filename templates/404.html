<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница не найдена (404)</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center text-gray-800">
    <div class="max-w-md text-center p-8 bg-white shadow-xl rounded-2xl">
        <h1 class="text-6xl font-black text-red-500 mb-2">404</h1>
        <h2 class="text-2xl font-bold mb-4">Страница не найдена</h2>
        <p class="text-gray-600 mb-6">
            Запрашиваемая вами страница не существует или была перемещена.
        </p>
        <a href="/" class="inline-block px-6 py-3 bg-blue-600 text-white font-semibold rounded-lg shadow hover:bg-blue-700 transition">
            На главную
        </a>
    </div>
</body>
</html>
